name: Refresh RMT market intelligence
on:
  schedule:
    - cron: '17 * * * *'
    - cron: '2,32,47 * * * *'
  workflow_dispatch:
    inputs:
      discovery_only:
        description: Run only finalized NFT discovery
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: rmt-market-intelligence
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && !inputs.discovery_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh OpenSea and chain shadow
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'
        run: node scripts/refresh-market-intelligence.mjs
      - name: Advance chain shadow only
        if: github.event.schedule == '2,32,47 * * * *'
        run: node scripts/refresh-market-intelligence.mjs --chain-shadow
  nft-discovery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scan finalized Robinhood NFT activity and reconcile Mint Radar
        run: node scripts/refresh-market-intelligence.mjs --nft-discovery-shadow
