"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# Netlify serves a small redirect entrypoint. The complete app runs on Sites.
# Do not publish dist/client or dist/server as a standalone Netlify app.
[build]
  command = "node scripts/build-netlify-entry.mjs"
  publish = "dist/netlify-entry"

[build.environment]
  NODE_VERSION = "24"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# The deploy-preview scanner flags Firebase's intentionally public browser ID.
# Match that single reviewed value; all other values and files remain scanned.
[context.deploy-preview.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDxzd7IG2ntLP1Y7R13EiKrXx8ez63KsPQ"
